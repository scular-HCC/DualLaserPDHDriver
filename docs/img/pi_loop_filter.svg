<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3" fill="#1f2a37"/>
    </marker>
  </defs>

  <style>
    .wire{stroke:#1f2a37;stroke-width:2;fill:none;stroke-linecap:round;}
    .body{stroke:#1f2a37;stroke-width:2.2;fill:#ffffff;}
    .plate{stroke:#1f2a37;stroke-width:2.4;}
    .jct{fill:#1f2a37;}
    .des{font-size:13px;fill:#0f2440;font-style:italic;font-weight:600;}
    .val{font-size:12px;fill:#3a4654;}
    .pin{font-size:12px;fill:#5a6675;}
    .note{font-size:12px;fill:#465061;}
    text{dominant-baseline:middle;}
    .ntext{font-size:12px;fill:#0e3d73;font-weight:600;}
    .nbox{fill:#e9f3ff;stroke:#2b7fff;stroke-width:1.3;}
    .pbox{fill:#fff3e6;stroke:#e08a2b;stroke-width:1.3;}
    .pwr{font-size:12px;fill:#a23b00;font-weight:600;}
  </style>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="34" y="30" font-size="19" font-weight="700" fill="#111" font-style="normal">Analog PI Loop Filter / Integrator — per channel (CH1)</text>
  <line x1="34" y1="44" x2="966" y2="44" stroke="#d8dee6" stroke-width="1.5"/>

  <!-- ================= PI INTEGRATOR ================= -->

  <!-- ERR1 input net flag -->
  <rect class="nbox" x="58" y="222" width="58" height="20" rx="4"/>
  <text class="ntext" x="87" y="232" text-anchor="middle">ERR1</text>
  <line class="wire" x1="116" y1="232" x2="190" y2="232"/>

  <!-- Ri (input resistor) -->
  <rect class="body" x="190" y="225" width="40" height="14" rx="2"/>
  <text class="des" x="210" y="210" text-anchor="middle">Rᵢ</text>
  <text class="val" x="210" y="221" text-anchor="middle" style="display:none"></text>
  <text class="val" x="244" y="210" text-anchor="middle">10k</text>
  <line class="wire" x1="230" y1="232" x2="440" y2="232"/>

  <!-- summing node -->
  <circle class="jct" cx="440" cy="232" r="3.4"/>

  <!-- op-amp U830 -->
  <polygon class="body" points="470,212 470,298 552,255"/>
  <text class="des" x="500" y="258" text-anchor="middle" font-size="12">U830</text>
  <text class="val" x="500" y="272" text-anchor="middle" font-size="10">OPA192</text>
  <text class="pin" x="481" y="232" font-size="15">−</text>
  <text class="pin" x="481" y="278" font-size="15">+</text>
  <!-- inverting input stub -->
  <line class="wire" x1="440" y1="232" x2="470" y2="232"/>
  <!-- non-inv input stub -->
  <line class="wire" x1="440" y1="278" x2="470" y2="278"/>
  <!-- output stub -->
  <line class="wire" x1="552" y1="255" x2="600" y2="255"/>
  <!-- supply stubs -->
  <line class="wire" x1="510" y1="234" x2="510" y2="200"/>
  <text class="pwr" x="510" y="192" text-anchor="middle">+15V</text>
  <line class="wire" x1="510" y1="276" x2="510" y2="312"/>
  <text class="pwr" x="510" y="322" text-anchor="middle">−15V</text>

  <!-- feedback riser from summing node -->
  <line class="wire" x1="440" y1="232" x2="440" y2="150"/>
  <!-- top feedback wire -->
  <line class="wire" x1="440" y1="150" x2="465" y2="150"/>
  <!-- Rp -->
  <rect class="body" x="465" y="143" width="40" height="14" rx="2"/>
  <text class="des" x="476" y="174" text-anchor="middle">Rₚ</text>
  <text class="val" x="498" y="174" text-anchor="middle">1k</text>
  <line class="wire" x1="505" y1="150" x2="540" y2="150"/>
  <circle class="jct" cx="540" cy="150" r="3.2"/>
  <!-- Ci -->
  <line class="wire" x1="540" y1="150" x2="561" y2="150"/>
  <line class="plate" x1="561" y1="137" x2="561" y2="163"/>
  <line class="plate" x1="569" y1="137" x2="569" y2="163"/>
  <line class="wire" x1="569" y1="150" x2="600" y2="150"/>
  <text class="des" x="556" y="180" text-anchor="middle">Cᵢ</text>
  <text class="val" x="576" y="180" text-anchor="middle">1n</text>
  <circle class="jct" cx="600" cy="150" r="3.2"/>
  <!-- output riser -->
  <line class="wire" x1="600" y1="150" x2="600" y2="255"/>
  <circle class="jct" cx="600" cy="255" r="3.2"/>

  <!-- ADG419 hold/reset across Ci -->
  <line class="wire" x1="540" y1="150" x2="540" y2="112"/>
  <line class="wire" x1="600" y1="150" x2="600" y2="112"/>
  <rect class="pbox" x="531" y="84" width="78" height="28" rx="4"/>
  <text x="570" y="94" text-anchor="middle" font-size="12" fill="#7a3a00" font-weight="600">ADG419</text>
  <text x="570" y="105" text-anchor="middle" font-size="9.5" fill="#7a3a00">hold / reset</text>
  <line class="wire" x1="570" y1="84" x2="570" y2="68"/>
  <rect class="nbox" x="538" y="48" width="64" height="20" rx="4"/>
  <text class="ntext" x="570" y="58" text-anchor="middle">LOCK1_EN</text>

  <!-- VREF_MID into + input -->
  <line class="wire" x1="440" y1="278" x2="440" y2="304"/>
  <rect class="nbox" x="405" y="306" width="74" height="20" rx="4"/>
  <text class="ntext" x="442" y="316" text-anchor="middle">VREF_MID</text>

  <!-- output / CORR1 -->
  <text class="des" x="604" y="272" text-anchor="start">CORR1</text>
  <line class="wire" x1="600" y1="255" x2="640" y2="255"/>
  <!-- Rsum -->
  <rect class="body" x="640" y="248" width="40" height="14" rx="2"/>
  <text class="des" x="660" y="234" text-anchor="middle">Rₛᵤₘ</text>
  <text class="val" x="660" y="222" text-anchor="middle" style="display:none"></text>
  <text class="val" x="660" y="245" text-anchor="middle" style="display:none"></text>
  <text class="val" x="694" y="234" text-anchor="middle">10k</text>
  <line class="wire" x1="680" y1="255" x2="752" y2="255"/>
  <rect class="nbox" x="752" y="245" width="92" height="20" rx="4"/>
  <text class="ntext" x="798" y="255" text-anchor="middle">DITH1_SUM</text>
  <text class="note" x="798" y="278" text-anchor="middle" font-size="10.5">→ OPA192 IN+ (laser setpoint)</text>

  <!-- ================= VREF_MID GENERATOR ================= -->
  <line x1="34" y1="384" x2="966" y2="384" stroke="#eef1f5" stroke-width="1.2"/>
  <text x="34" y="404" font-size="15" font-weight="700" fill="#222" font-style="normal">VREF_MID generator (mid-supply reference)</text>

  <!-- +5V_RF -->
  <rect class="pbox" x="120" y="424" width="64" height="20" rx="4"/>
  <text class="pwr" x="152" y="434" text-anchor="middle">+5V_RF</text>
  <line class="wire" x1="152" y1="444" x2="152" y2="462"/>
  <!-- Ra -->
  <rect class="body" x="145" y="462" width="14" height="40" rx="2"/>
  <text class="des" x="172" y="475" text-anchor="start">Rₐ</text>
  <text class="val" x="172" y="490" text-anchor="start">10k</text>
  <line class="wire" x1="152" y1="502" x2="152" y2="520"/>
  <circle class="jct" cx="152" cy="520" r="3.2"/>
  <!-- Rb -->
  <rect class="body" x="145" y="520" width="14" height="40" rx="2"/>
  <text class="des" x="172" y="533" text-anchor="start">R_b</text>
  <text class="val" x="172" y="548" text-anchor="start">10k</text>
  <line class="wire" x1="152" y1="560" x2="152" y2="578"/>
  <!-- GND for divider -->
  <line class="wire" x1="139" y1="578" x2="165" y2="578"/>
  <line class="wire" x1="143" y1="583" x2="161" y2="583"/>
  <line class="wire" x1="147" y1="588" x2="157" y2="588"/>

  <!-- buffer to mid -->
  <line class="wire" x1="152" y1="520" x2="196" y2="520"/>
  <line class="wire" x1="196" y1="520" x2="196" y2="494"/>
  <line class="wire" x1="196" y1="494" x2="232" y2="494"/>

  <!-- buffer op-amp U_REF -->
  <polygon class="body" points="252,474 252,538 322,506"/>
  <text class="des" x="280" y="510" text-anchor="middle" font-size="11">U_REF</text>
  <text class="pin" x="263" y="494" font-size="14">+</text>
  <text class="pin" x="263" y="518" font-size="14">−</text>
  <line class="wire" x1="232" y1="494" x2="252" y2="494"/>
  <line class="wire" x1="232" y1="518" x2="252" y2="518"/>
  <line class="wire" x1="322" y1="506" x2="360" y2="506"/>
  <!-- unity feedback -->
  <line class="wire" x1="360" y1="506" x2="360" y2="556"/>
  <line class="wire" x1="360" y1="556" x2="214" y2="556"/>
  <line class="wire" x1="214" y1="556" x2="214" y2="518"/>
  <line class="wire" x1="214" y1="518" x2="232" y2="518"/>
  <circle class="jct" cx="360" cy="506" r="3.2"/>

  <!-- C_ref + VREF_MID out -->
  <line class="wire" x1="360" y1="506" x2="430" y2="506"/>
  <rect class="nbox" x="430" y="496" width="74" height="20" rx="4"/>
  <text class="ntext" x="467" y="506" text-anchor="middle">VREF_MID</text>
  <!-- C_ref drop -->
  <line class="wire" x1="398" y1="506" x2="398" y2="528"/>
  <circle class="jct" cx="398" cy="506" r="3"/>
  <line class="plate" x1="385" y1="528" x2="411" y2="528"/>
  <line class="plate" x1="385" y1="536" x2="411" y2="536"/>
  <line class="wire" x1="398" y1="536" x2="398" y2="556"/>
  <text class="des" x="418" y="530" text-anchor="start">C_ref</text>
  <text class="val" x="418" y="544" text-anchor="start">100n</text>
  <!-- GND for C_ref -->
  <line class="wire" x1="385" y1="556" x2="411" y2="556"/>
  <line class="wire" x1="389" y1="561" x2="407" y2="561"/>
  <line class="wire" x1="393" y1="566" x2="403" y2="566"/>

  <!-- ================= NOTES ================= -->
  <rect x="560" y="404" width="406" height="172" rx="8" fill="#f7f9fc" stroke="#d8dee6" stroke-width="1.2"/>
  <text x="578" y="428" font-size="13" font-weight="700" fill="#1f2a37" font-style="normal">How it works</text>
  <text class="note" x="578" y="450">Inverting PI:  V_CORR1 = −(Rₚ + 1/sCᵢ)/Rᵢ · (V_ERR1 − V_REF)</text>
  <text class="note" x="578" y="470">• Integrator unity-gain  fᵢ = 1/(2π·Rᵢ·Cᵢ) ≈ 15.9 kHz</text>
  <text class="note" x="578" y="490">• PI zero  f_z = 1/(2π·Rₚ·Cᵢ) ≈ 159 kHz</text>
  <text class="note" x="578" y="510">• ADG419 shorts Cᵢ → HOLD/RESET while acquiring</text>
  <text class="note" x="578" y="524" font-size="10.5" fill="#647084">   (LOCK1_EN: HIGH = RUN / loop closed, LOW = hold)</text>
  <text class="note" x="578" y="544">• Output CORR1 → Rₛᵤₘ → DITH1_SUM (OPA192 IN+)</text>
  <text class="note" x="578" y="564">• IN+ referenced to VREF_MID (mid-supply), not GND</text>
</svg>
