<svg width="100%" viewBox="0 0 680 792" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Laser Driver v7 universal slot pinout, DIN 41612 Type C 96-way</title>
<desc>Every rail owns a whole column spanning rows a, b and c. Signals sit only in rows a and c, with ground interleaved along each row and a solid ground row b between them, so no signal is adjacent to another signal in either axis.</desc>
<style>
.pin-bg{fill:none}
text{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{fill:#141b28}
.ts{fill:#4c5a72}
.th{fill:#141b28;font-weight:600}
.tec rect{fill:#f7dfc4;stroke:#c2762a}
.supply rect{fill:#ded9f8;stroke:#6f61c7}
.rail rect{fill:#cfeee3;stroke:#2b8f74}
.sig rect{fill:#d5e7fb;stroke:#2c74c4}
.gnd rect{fill:#e2e7f0;stroke:#95a3bb}
rect{stroke-width:1}
.spare rect{fill:none;stroke:#95a3bb;stroke-dasharray:4 3}
.rule{stroke:#95a3bb;stroke-opacity:.5}
@media (prefers-color-scheme: dark){
 .t{fill:#e7ecf5} .ts{fill:#9fb0c8} .th{fill:#e7ecf5}
 .tec rect{fill:#4a3418;stroke:#c2762a}
 .supply rect{fill:#2e2a52;stroke:#8b7ae8}
 .rail rect{fill:#173d33;stroke:#3fae8f}
 .sig rect{fill:#152c47;stroke:#3d8fe0}
 .gnd rect{fill:#232c3e;stroke:#5a6880}
 .spare rect{stroke:#5a6880}
 .rule{stroke:#5a6880}
}
</style>
<text class="th" x="168" y="30" text-anchor="middle">a</text>
<text class="th" x="342" y="30" text-anchor="middle">b</text>
<text class="th" x="516" y="30" text-anchor="middle">c</text>
<text class="ts" x="70" y="30" text-anchor="end">col</text>
<line class="rule" x1="8" y1="40" x2="600" y2="40"/>
<text class="ts" x="70" y="78" text-anchor="end">1-2</text>
<text class="ts" x="610" y="78">TEC</text>
<g class="tec"><rect x="84" y="64" width="516" height="20" rx="3"/>
<text class="t" x="96" y="78">+6V_TEC</text></g>
<text class="ts" x="588" y="78" text-anchor="end">whole column &#215;6</text>
<text class="ts" x="70" y="102" text-anchor="end">3-4</text>
